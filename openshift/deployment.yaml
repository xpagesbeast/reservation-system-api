apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-system-api
  labels:
    app: reservation-system-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservation-system-api
  template:
    metadata:
      labels:
        app: reservation-system-api
    spec:
      containers:
      - name: api
        image: reservation-system-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: database-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
