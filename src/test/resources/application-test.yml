spring:
  application:
    name: reservation-system
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: never

logging:
  level:
    com.reservation_system: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO

opentelemetry:
  exporter:
    otlp:
      endpoint: http://localhost:4317
  traces:
    exporter: none
